[package]
name = "ai-desktop-pet"
version = "0.1.0"
description = "AI Desktop Pet - Your effortless knowledge companion"
authors = ["AI Desktop Pet Team"]
edition = "2021"

[lib]
name = "ai_desktop_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
