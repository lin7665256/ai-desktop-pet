[package]
name = "spike-tauri-real"
version = "0.1.0"
description = "Spike 1/2: Tauri 透明窗口 + 文件拖拽真实实现"
authors = ["AI Desktop Pet Team"]
edition = "2021"

[lib]
name = "spike_tauri_real_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
